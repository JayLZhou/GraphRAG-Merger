[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-merge"
version = "0.0.1"
description = "Efficient semantic index merging for graph-augmented RAG systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JayLZhou" }]
keywords = ["graphrag", "rag", "knowledge-graph", "index-merge", "retrieval"]

# Zero third-party runtime dependencies on purpose: the data model, algorithms,
# similarity helpers, and synthetic benchmark are all pure standard-library
# Python. (A future GraphRAG parquet adapter will add pandas/pyarrow lazily.)
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pandas>=2.0",
    "pyarrow>=12",
]
# GraphRAG parquet adapter (semantic_merge.adapters.graphrag)
graphrag = [
    "pandas>=2.0",
    "pyarrow>=12",
]

[project.urls]
Homepage = "https://github.com/JayLZhou/GraphRAG-Merger"
Repository = "https://github.com/JayLZhou/GraphRAG-Merger"

[tool.setuptools.packages.find]
include = ["semantic_merge*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
